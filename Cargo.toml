[package]
name = "ctxbroker"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "=4.4.18", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
anyhow = "1"

# --- broker + MCP layer -----------------------------------------------------
# UNVERIFIED in this environment: rustc here caps at 1.75 and these crates'
# dependency trees need edition2024 (see chat notes). Build/fix on a machine
# with rustc 1.85+ before trusting any of this to compile.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
async-trait = "0.1"
lapin = "2"
async-nats = "0.37"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
rmcp = { version = "0.3", features = ["server", "transport-io"] }
schemars = "0.8"
